<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="45%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"><animate attributeName="stop-color" values="#58a6ff;#a78bfa;#f472b6;#22d3ee;#58a6ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#58a6ff;#a78bfa" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#58a6ff;#a78bfa;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cubeTop1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4c8dff"/><stop offset="100%" stop-color="#1f6feb"/></linearGradient>
    <linearGradient id="cubeTop2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="cubeTop3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"><animate attributeName="stdDeviation" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="holoShift" x="-50%" y="-50%" width="200%" height="200%">
      <feColorMatrix type="hueRotate" values="0"><animate attributeName="values" values="0;360" dur="9s" repeatCount="indefinite"/></feColorMatrix>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad)"/>

  <!-- drifting particles -->
  <g fill="#58a6ff">
    <circle cx="120" cy="360" r="1.6" opacity="0.7"><animate attributeName="cy" values="360;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="360" r="1.3" opacity="0.6" fill="#a78bfa"><animate attributeName="cy" values="360;-10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="360" r="1.8" opacity="0.6" fill="#22d3ee"><animate attributeName="cy" values="360;-10" dur="6.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="360" r="1.4" opacity="0.6" fill="#f472b6"><animate attributeName="cy" values="360;-10" dur="8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="360" r="1.6" opacity="0.6"><animate attributeName="cy" values="360;-10" dur="7.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- circuit board trace pattern -->
  <g stroke="#2b3a5f" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M0 60 H180 V30 H340"/>
    <path d="M0 320 H140 V350 H420"/>
    <path d="M1200 90 H1000 V50 H860"/>
    <path d="M1200 300 H980 V330 H700"/>
    <path d="M60 0 V40 H30"/>
    <path d="M1140 0 V50 H1170"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="180" cy="60" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="30" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="320" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="350" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="90" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="50" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="300" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="330" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- extruded 3D holographic name -->
  <g font-family="'Courier New', monospace" font-weight="700" text-anchor="middle">
    <text x="606" y="126" font-size="64" fill="#040609">AKSHAT PANDEY</text>
    <text x="604" y="124" font-size="64" fill="#0a1024">AKSHAT PANDEY</text>
    <text x="602" y="122" font-size="64" fill="#111a3d">AKSHAT PANDEY</text>
    <text x="600" y="120" font-size="64" fill="url(#textGrad)" filter="url(#glow)">AKSHAT PANDEY</text>
  </g>

  <text x="600" y="165" font-family="'Courier New', monospace" font-size="20" fill="#8b949e" text-anchor="middle">
    &lt;SoftwareEngineer /&gt;  —  AI/ML  ×  Full-Stack  ×  Systems
  </text>

  <!-- floating iso cubes, hue-shifting + bobbing -->
  <g filter="url(#holoShift)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="3.2s" repeatCount="indefinite"/>
      <polygon points="90,210 130,190 170,210 130,230" fill="url(#cubeTop1)"/>
      <polygon points="90,210 130,230 130,270 90,250" fill="#123a80"/>
      <polygon points="170,210 130,230 130,270 170,250" fill="#1f6feb"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      <polygon points="1050,200 1085,183 1120,200 1085,217" fill="url(#cubeTop2)"/>
      <polygon points="1050,200 1085,217 1085,252 1050,235" fill="#3f1f8f"/>
      <polygon points="1120,200 1085,217 1085,252 1120,235" fill="#6d28d9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-9; 0,0" dur="3.6s" begin="1.1s" repeatCount="indefinite"/>
      <polygon points="1000,300 1030,286 1060,300 1030,314" fill="url(#cubeTop3)"/>
      <polygon points="1000,300 1030,314 1030,344 1000,330" fill="#0b6478"/>
      <polygon points="1060,300 1030,314 1030,344 1060,330" fill="#0e93aa"/>
    </g>
  </g>

  <!-- terminal window -->
  <rect x="230" y="215" width="740" height="150" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="230" y="215" width="740" height="28" rx="10" fill="#161b22"/>
  <rect x="230" y="229" width="740" height="14" fill="#161b22"/>
  <circle cx="252" cy="229" r="5" fill="#ff5f56"/>
  <circle cx="270" cy="229" r="5" fill="#ffbd2e"/>
  <circle cx="288" cy="229" r="5" fill="#27c93f"/>
  <text x="600" y="229" font-family="'Courier New', monospace" font-size="11" fill="#6e7681" text-anchor="middle">akshat.dev — zsh</text>

  <g font-family="'Courier New', monospace" font-size="15">
    <text x="252" y="272" fill="#c9d1d9">const <tspan fill="#79c0ff">engineer</tspan> = {</text>
    <text x="270" y="294" fill="#c9d1d9">name: <tspan fill="#a5d6ff">'Akshat Pandey'</tspan>,</text>
    <text x="270" y="316" fill="#c9d1d9">fellowship: <tspan fill="#a5d6ff">'FOSSEE @ IIT Bombay'</tspan>,</text>
    <text x="270" y="338" fill="#c9d1d9">focus: [<tspan fill="#a5d6ff">'AI/ML'</tspan>, <tspan fill="#a5d6ff">'Full-Stack'</tspan>, <tspan fill="#a5d6ff">'Systems'</tspan>],</text>
    <text x="252" y="358" fill="#c9d1d9">};</text>
    <rect x="290" y="346" width="9" height="15" fill="#58a6ff"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- holographic sheen sweep, on top of everything -->
  <rect x="-400" y="0" width="220" height="380" fill="url(#sheenGrad)" transform="skewX(-18)">
    <animate attributeName="x" values="-400;1400" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg viewBox="0 0 1250 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/><stop offset="100%" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="sheenGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipAll"><rect x="0" y="0" width="1250" height="600" rx="14"/></clipPath>
  </defs>

  <rect width="1250" height="600" fill="url(#bg2)" rx="14"/>

  <g clip-path="url(#clipAll)">

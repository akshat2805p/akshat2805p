  <text x="625" y="565" font-family="'Courier New', monospace" font-size="12" fill="#484f58" text-anchor="middle">generated from project history · FOSSEE · RetinAI · DevRA · VortexLang</text>

  <rect x="-500" y="0" width="260" height="600" fill="url(#sheenGrad2)" transform="skewX(-18)">
    <animate attributeName="x" values="-500;1500" dur="5s" repeatCount="indefinite"/>
  </rect>

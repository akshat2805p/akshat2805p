  <text x="150" y="500" font-family="'Courier New', monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">AI / ML</text>
  <text x="150" y="518" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" text-anchor="middle">90%</text>
  <text x="370" y="500" font-family="'Courier New', monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">Full-Stack</text>
  <text x="370" y="518" font-family="'Courier New', monospace" font-size="13" fill="#a78bfa" text-anchor="middle">85%</text>
  <text x="590" y="500" font-family="'Courier New', monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">DSA</text>
  <text x="590" y="518" font-family="'Courier New', monospace" font-size="13" fill="#22d3ee" text-anchor="middle">82%</text>

    <circle cx="420" cy="580" r="1.4" fill="#22d3ee"><animate attributeName="cy" values="580;0" dur="9.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="9.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="580" r="1.7" fill="#f472b6"><animate attributeName="cy" values="580;0" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="580" r="1.5"><animate attributeName="cy" values="580;0" dur="8.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8.5s" begin="0.5s" repeatCount="indefinite"/></circle>
